[project]
name = "fine-tuning-workbench"
version = "0.1.0"
description = "Model-agnostic fine-tuning workbench: dataset studio, eval harness, training launcher, deploy"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "jinja2>=3.1,<4",
    "transformers>=4.45",
    "huggingface_hub>=0.26",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
